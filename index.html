<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    <header>
        <h1>Expense Tracker App</h1>
        <button class="add-exp-btn">+ Add Expense</button>
    </header>

    
    <main>
        <section id="dashboard">
            <div class="dash-card">
                <h2 class="card-title">Total Expenses</h2>
                <p class="card-count" id="total-number"></p>
            </div>

            <div class="dash-card">
                <h2 class="card-title">Transactions</h2>
                <p class="card-count" id="transactions-number"></p>
            </div>
            <div class="dash-card">
                <h2 class="card-title">Highest Expense</h2>
                <p class="card-count" id="highest-exp"></p>
            </div>
            <div class="dash-card">
                <h2 class="card-title">Categories Used</h2>
                <p class="card-count" id="categories-number"></p>
            </div>

        </section>

        <section id="controls">
            <select id="filter-select">
                <option value="all">All</option>
                <option value="Food">Food</option>
                <option value="Bills">Bills</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Work">Work</option>
            </select>

            <select id="sort-select">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="high">Highest</option>
                <option value="low">Lowest</option>
                <option value="alpha">Alphabetical</option>
            </select>
            <input id="search-txt" type="text" placeholder="Search...">

        </section>

        <section id="list">
            <h2>Expenses List</h2>
            <p id="msg-txt"></p>
            <ul class="expenses-list">

            </ul>
        </section>
    </main>


    <div id="overlay"></div>

    <div id="form">
        <h2>Add Expense</h2>
        <button id="close-form-btn">x</button>
            
        <input id="desc-txt" type="text" placeholder="Description">
        <p class="error-msg" id="description-error"></p>

        <input id="amount-txt" type="number" placeholder="Amount">
        <p class="error-msg" id="amount-error"></p>
    
        <select id="category-select">
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Work</option>
            <option>Others</option>
        </select>
    
        <button id="submit-btn">Add Expense</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
